name: Submission alerts

# Emails the editorial office whenever a submission has not been announced yet.
# The work itself is in tools/check_submissions.py — this file only schedules it.
#
# Deliberately triggered ONLY by schedule and by hand. On a public repository,
# adding pull_request here would let outside contributors reach the secrets.

on:
  schedule:
    # every 10 minutes. GitHub may delay this under load; that is fine.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

# Never let two runs overlap — two runs at once could both email the same row.
concurrency:
  group: submission-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for new submissions
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAIL_USER:            ${{ secrets.MAIL_USER }}
          MAIL_PASS:            ${{ secrets.MAIL_PASS }}
          MAIL_TO:              ${{ secrets.MAIL_TO }}
          MAIL_HOST:            ${{ secrets.MAIL_HOST }}
          MAIL_PORT:            ${{ secrets.MAIL_PORT }}
          SITE_URL:             ${{ secrets.SITE_URL }}
        run: python tools/check_submissions.py
