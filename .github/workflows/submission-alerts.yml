name: Submission alerts

# Emails the editorial office whenever a submission has not been announced yet.
# The work itself is in tools/check_submissions.py — this file only schedules it.
#
# Only TWO secrets are needed (Settings → Secrets and variables → Actions):
#     SUPABASE_SERVICE_KEY   the service_role key from Supabase
#     MAIL_PASS              the 163 SMTP authorisation code
#
# Everything else below is already public — it is in assets/js/config.js and on
# the site itself — so it is written out here rather than made a secret. Fewer
# secrets means fewer steps to get wrong.
#
# Deliberately triggered ONLY by schedule and by hand. On a public repository,
# adding pull_request here would let outside contributors reach the secrets.

on:
  schedule:
    # every 10 minutes. GitHub may delay this under load; that is fine.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

# Never let two runs overlap — two runs at once could both email the same row.
concurrency:
  group: submission-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    env:
      # ---- public values, change here if any of them change ----
      SUPABASE_URL: "https://eaueuxvizikfepbfponj.supabase.co"
      MAIL_HOST:    "smtp.163.com"
      MAIL_USER:    "18755246110@163.com"
      MAIL_TO:      "18755246110@163.com"
      SITE_URL:     "https://yangran12.github.io/YRpublish"

      # ---- the two that must stay secret ----
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MAIL_PASS:            ${{ secrets.MAIL_PASS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for new submissions
        run: python tools/check_submissions.py
